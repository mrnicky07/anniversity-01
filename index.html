<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --pink:#ff4d6d;
    --purple:#7b2cbf;
}

/* Romantic Gradient Background */
body{
    margin:0;
    font-family:Poppins;
    color:white;
    overflow:hidden;
    background: linear-gradient(-45deg, #ff758c, #ff7eb3, #7b2cbf, #ff4d6d);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Sections */
.section{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    opacity:0;
    visibility:hidden;
    transition:.6s;
}
.section.active{
    opacity:1;
    visibility:visible;
}

h1{
    font-family:'Dancing Script';
    font-size:2.5rem;
    text-align:center;
    text-shadow:0 0 15px rgba(255,255,255,0.6);
}

.btn{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.3);
    padding:12px 25px;
    color:white;
    border-radius:50px;
    margin-top:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

/* Input */
input{
    padding:10px;
    border-radius:20px;
    border:none;
    margin-top:15px;
    text-align:center;
}

/* Floating hearts */
#hearts span{
    position:absolute;
    animation:float 6s linear infinite;
}
@keyframes float{
    0%{transform:translateY(100vh) scale(0);}
    100%{transform:translateY(-10vh) scale(1);}
}

/* Slider */
.slider{
    width:90%;
    max-width:300px;
    height:400px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}
.slide{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:1s;
}
.slide.active{opacity:1;}
.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Mobile */
@media(max-width:480px){
    h1{font-size:2rem;}
}
</style>
</head>

<body>

<div id="hearts"></div>

<audio id="music" loop>
<source src="music.mp3">
</audio>

<!-- NAME INPUT -->
<section id="start" class="section active">
<h1>Enter Your Name ❤️</h1>
<input id="name" placeholder="Your Name">
<button class="btn" onclick="begin()">Start 💌</button>
</section>

<!-- ENTRY -->
<section id="entry" class="section">
<h1 id="typing"></h1>
<button class="btn" onclick="next('entry','game')">Next ❤️</button>
</section>

<!-- GAME -->
<section id="game" class="section">
<h1 id="question"></h1>
<button class="btn" onclick="next('game','memories')">YES ❤️</button>
<button class="btn" id="no-btn">NO 😜</button>
</section>

<!-- MEMORIES -->
<section id="memories" class="section">
<h1>Our Moments 💕</h1>
<div class="slider">
<div class="slide active"><img src="img01.jpg"></div>
<div class="slide"><img src="img02.jpg"></div>
<div class="slide"><img src="img03.jpg"></div>
</div>
<button class="btn" onclick="next('memories','proposal')">Next 💌</button>
</section>

<!-- PROPOSAL -->
<section id="proposal" class="section">
<h1 id="proposalText"></h1>
<button class="btn" onclick="next('proposal','final')">YES 💍</button>
</section>

<!-- FINAL -->
<section id="final" class="section">
<h1 id="finalText"></h1>
<button class="btn" onclick="celebrate()">Celebrate 🎉</button>
</section>

<script>

let userName="";

/* Start */
function begin(){
userName=document.getElementById("name").value || "My Love";
document.getElementById("music").play().catch(()=>{});
next('start','entry');

typeEffect(document.getElementById("typing"),[
`Hey ${userName} ❤️`,
"I have something special for you 💌",
"You mean everything to me 💕"
]);
}

/* Navigation */
function next(a,b){
document.getElementById(a).classList.remove("active");
document.getElementById(b).classList.add("active");

if(b==="game"){
document.getElementById("question").innerHTML=`${userName}, do you love me? 😏`;
}
if(b==="proposal"){
document.getElementById("proposalText").innerHTML=`${userName}, will you stay with me forever? 💍`;
}
if(b==="final"){
document.getElementById("finalText").innerHTML=`I love you ${userName} ❤️`;
}
}

/* Typing */
function typeEffect(el,textArr,speed=70){
let i=0,j=0;
function type(){
if(i<textArr.length){
if(j<textArr[i].length){
el.innerHTML+=textArr[i][j];
j++;setTimeout(type,speed);
}else{
setTimeout(()=>{el.innerHTML="";j=0;i++;type();},1500);
}
}}
type();
}

/* NO button */
const noBtn=document.getElementById("no-btn");
noBtn.addEventListener("mouseover",move);
noBtn.addEventListener("touchstart",(e)=>{e.preventDefault();move();});

function move(){
const x=Math.random()*(window.innerWidth-100);
const y=Math.random()*(window.innerHeight-50);
noBtn.style.position="absolute";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
}

/* Slider */
let i=0;
const slides=document.querySelectorAll(".slide");
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},3000);

/* Hearts */
setInterval(()=>{
let h=document.createElement("span");
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);

/* Confetti */
function celebrate(){
confetti({particleCount:200,spread:80});
}

</script>

</body>
</html>
